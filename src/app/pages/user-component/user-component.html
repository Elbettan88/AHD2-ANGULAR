<h1>USUARIOS</h1>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
    </tr>
  </thead>
  <tbody>
    <!-- Corregido: cambiamos 'usuarios' por 'listaUsuarios()' -->
    @for (usuario of listaUsuarios(); track usuario.id) {
      <tr>
        <td>{{ usuario.id }}</td>
        <td>{{ usuario.name }}</td>
        <td>{{ usuario.email }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="3" style="text-align: center;">Cargando información de usuarios...</td>
      </tr>
    }
  </tbody>
</table>
